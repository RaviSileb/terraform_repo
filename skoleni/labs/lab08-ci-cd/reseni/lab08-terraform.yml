# Referenční pipeline pro lab 08.
# Instalace: zkopírujte do .github/workflows/lab08-terraform.yml ve svém forku.
name: "Lab 08 – Terraform CI/CD"

on:
  pull_request:
    paths:
      - "skoleni/labs/lab08-ci-cd/infra/**"
      - ".github/workflows/lab08-terraform.yml"
  push:
    branches: [main]
    paths:
      - "skoleni/labs/lab08-ci-cd/infra/**"
  workflow_dispatch:

# Princip nejmenších oprávnění. Pro OIDC do cloudu přidejte id-token: write.
permissions:
  contents: read

# Nikdy dva běhy nad stejným stavem současně; běžící apply se nepřerušuje.
concurrency:
  group: terraform-lab08-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_DIR: skoleni/labs/lab08-ci-cd/infra

jobs:
  kontrola:
    name: Kontrola a plán
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6

      - name: Formát
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init

      - name: Validace
        run: terraform validate

      - name: Lint
        run: |
          tflint --init
          tflint --format compact

      - name: Testy
        run: terraform test

      - name: Plán
        run: terraform plan -out=tfplan

      - name: Plán do souhrnu běhu
        run: |
          {
            echo "### Terraform plán (\`${TF_DIR}\`)"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 5

  nasazeni:
    name: Nasazení (po schválení)
    needs: kontrola
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Prostředí s pravidlem „Required reviewers“ = ruční schválení před apply.
    environment: skoleni-produkce
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - name: Init
        run: terraform init

      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      # Aplikuje se přesně ten plán, který prošel kontrolou v tomto běhu.
      - name: Apply
        run: terraform apply tfplan
