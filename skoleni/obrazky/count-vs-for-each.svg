<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif">
  <title>Odebrání prostředního prvku: count posune indexy, for_each ne</title>
  <rect width="960" height="540" rx="18" fill="#F8FAFC"/>
  <text x="40" y="56" font-size="28" font-weight="700" fill="#0F172A">Odebíráme „api“ ze středu seznamu</text>
  <text x="40" y="84" font-size="16" fill="#475569">Adresa zdroje = typ.jméno + index (count) nebo klíč (for_each). Změna adresy = jiný zdroj.</text>

  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15">
    <text x="40" y="130" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="20" font-weight="700" fill="#B45309">count – adresuje indexem</text>
    <text x="40" y="160" fill="#475569" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="14">před</text>
    <text x="250" y="160" fill="#475569" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="14">po</text>
    <rect x="40" y="172" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="54" y="200" fill="#0F172A">[0] web</text>
    <rect x="40" y="226" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="54" y="254" fill="#0F172A">[1] api</text>
    <rect x="40" y="280" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="54" y="308" fill="#0F172A">[2] docs</text>
    <rect x="250" y="172" width="210" height="44" rx="8" fill="#DCFCE7" stroke="#16A34A"/><text x="264" y="200" fill="#14532D">[0] web    beze změny</text>
    <rect x="250" y="226" width="210" height="44" rx="8" fill="#FEF3C7" stroke="#D97706"/><text x="264" y="254" fill="#78350F">[1] docs   -/+ replace</text>
    <rect x="250" y="280" width="210" height="44" rx="8" fill="#FEE2E2" stroke="#DC2626"/><text x="264" y="308" fill="#7F1D1D">[2]        - destroy</text>
    <text x="40" y="360" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7F1D1D" font-weight="700">Plan: 1 to add, 2 to destroy</text>
    <text x="40" y="384" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#475569">„docs“ se nezměnila, přesto se nahradí.</text>
  </g>

  <line x1="485" y1="120" x2="485" y2="400" stroke="#CBD5E1" stroke-width="2"/>

  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15">
    <text x="510" y="130" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">for_each – adresuje klíčem</text>
    <text x="510" y="160" fill="#475569" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="14">před</text>
    <text x="720" y="160" fill="#475569" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="14">po</text>
    <rect x="510" y="172" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="524" y="200" fill="#0F172A">["web"]</text>
    <rect x="510" y="226" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="524" y="254" fill="#0F172A">["api"]</text>
    <rect x="510" y="280" width="190" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="524" y="308" fill="#0F172A">["docs"]</text>
    <rect x="720" y="172" width="210" height="44" rx="8" fill="#DCFCE7" stroke="#16A34A"/><text x="734" y="200" fill="#14532D">["web"]  beze změny</text>
    <rect x="720" y="226" width="210" height="44" rx="8" fill="#FEE2E2" stroke="#DC2626"/><text x="734" y="254" fill="#7F1D1D">["api"]  - destroy</text>
    <rect x="720" y="280" width="210" height="44" rx="8" fill="#DCFCE7" stroke="#16A34A"/><text x="734" y="308" fill="#14532D">["docs"] beze změny</text>
    <text x="510" y="360" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#166534" font-weight="700">Plan: 0 to add, 1 to destroy</text>
    <text x="510" y="384" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#475569">Zničí se jen to, co jste opravdu odebrali.</text>
  </g>

  <rect x="40" y="420" width="890" height="84" rx="12" fill="#EEF2FF"/>
  <text x="60" y="452" font-size="15" fill="#312E81"><tspan font-weight="700">Pravidlo:</tspan> <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">count</tspan> pro „0 nebo 1“ a pro identické, zaměnitelné kusy. <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">for_each</tspan> pro vše, co má identitu.</text>
  <text x="60" y="480" font-size="15" fill="#312E81">Přechod z count na for_each bez výpadku: bloky <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">moved { from = x[0]  to = x["web"] }</tspan>.</text>
</svg>
