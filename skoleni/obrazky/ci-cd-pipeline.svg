<svg xmlns="http://www.w3.org/2000/svg" style="font-variant-ligatures:none" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif">
  <title>Pipeline pro Terraform: pull request s kontrolami a plánem, po merge schválení a apply</title>
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="960" height="540" rx="18" fill="#F8FAFC"/>
  <text x="40" y="56" font-size="28" font-weight="700" fill="#0F172A">CI/CD pro Terraform</text>
  <text x="40" y="84" font-size="16" fill="#475569">Nikdo neaplikuje z notebooku. Kód i plán projdou review, apply až po schválení.</text>

  <text x="40" y="136" font-size="15" font-weight="700" fill="#5B21B6">Pull request</text>
  <g font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">
    <rect x="40" y="150" width="110" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="95" y="180">fmt -check</text>
    <rect x="170" y="150" width="100" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="220" y="180">validate</text>
    <rect x="290" y="150" width="90" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="335" y="180">tflint</text>
    <rect x="400" y="150" width="90" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="445" y="180">test</text>
    <rect x="510" y="150" width="150" height="50" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="585" y="180">plan → souhrn</text>
    <rect x="680" y="150" width="240" height="50" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="800" y="180" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif">code review kódu i plánu</text>
  </g>
  <g stroke="#475569" stroke-width="2"><line x1="150" y1="175" x2="166" y2="175" marker-end="url(#s)"/><line x1="270" y1="175" x2="286" y2="175" marker-end="url(#s)"/><line x1="380" y1="175" x2="396" y2="175" marker-end="url(#s)"/><line x1="490" y1="175" x2="506" y2="175" marker-end="url(#s)"/><line x1="660" y1="175" x2="676" y2="175" marker-end="url(#s)"/></g>

  <path d="M800,200 L800,240 L95,240 L95,286" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
  <text x="440" y="232" font-size="13" fill="#475569" text-anchor="middle">merge do main</text>

  <text x="40" y="280" font-size="15" font-weight="700" fill="#166534" dx="80">main</text>
  <g font-size="13" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" text-anchor="middle">
    <rect x="40" y="290" width="110" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="95" y="320">kontroly</text>
    <rect x="170" y="290" width="160" height="50" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="250" y="320">plan -out=tfplan</text>
    <rect x="350" y="290" width="150" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="425" y="320" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif">artefakt tfplan</text>
    <rect x="520" y="290" width="200" height="50" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="620" y="320" font-family="Inter, 'Segoe UI', 'Noto Sans', 'DejaVu Sans', Arial, sans-serif">schválení (environment)</text>
    <rect x="740" y="290" width="180" height="50" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="830" y="320">apply tfplan</text>
  </g>
  <g stroke="#475569" stroke-width="2"><line x1="150" y1="315" x2="166" y2="315" marker-end="url(#s)"/><line x1="330" y1="315" x2="346" y2="315" marker-end="url(#s)"/><line x1="500" y1="315" x2="516" y2="315" marker-end="url(#s)"/><line x1="720" y1="315" x2="736" y2="315" marker-end="url(#s)"/></g>

  <g font-size="14" fill="#334155">
    <rect x="40" y="380" width="430" height="120" rx="12" fill="#EEF2FF"/>
    <text x="60" y="408" font-weight="700" fill="#312E81">Bezpečnost pipeline</text>
    <text x="60" y="434" fill="#312E81">• permissions: contents: read (nejmenší práva)</text>
    <text x="60" y="458" fill="#312E81">• OIDC do cloudu místo statických klíčů</text>
    <text x="60" y="482" fill="#312E81">• concurrency: jeden běh na stav</text>
    <rect x="490" y="380" width="430" height="120" rx="12" fill="#F0FDF4"/>
    <text x="510" y="408" font-weight="700" fill="#14532D">Stav a prostředí</text>
    <text x="510" y="434" fill="#14532D">• vzdálený backend se zamykáním</text>
    <text x="510" y="458" fill="#14532D">• dev / test / prod = oddělené stavy</text>
    <text x="510" y="482" fill="#14532D">• plánovaný plan -detailed-exitcode = drift</text>
  </g>
</svg>
